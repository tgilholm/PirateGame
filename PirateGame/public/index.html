<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Pirate Game</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="styles.css" />

    <script src="//cdn.jsdelivr.net/npm/phaser@3.86.0/dist/phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/scenes/index.js" type="module"></script>


</head>

<body>
    <div id="game-container"></div>

    <!-- Shop menu — content generated dynamically by ShopUI.js -->
    <div id="shop-menu" style="display:none;"></div>

    <form id="input-form">
        <div class="border">
            <input class="formElement" id="input-text" type="text" name="username" placeholder="Enter Username" required maxlength="16">
        </div> 
        <div class="border">
            <button class="formElement" id="start-btn" type="button">Start Game</button>
        </div>
    </form>


    <!-- Interaction prompt -->
    <div id="interaction-prompt" style="display:none;"></div>

     <!-- Minimap — content generated dynamically by Minimap.js -->
    <div id="minimap-container" style="display:none;"></div>

</body>


</html>
