<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Pirate Game</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="styles.css" />

		<!-- The browser cannot load assets in another folder by default -->
		<script type="importmap">
			{
				"imports": {
					"shared/built/": "/shared/",
					"shared/": "/shared/",
					"socket.io-client": "/socket.io/socket.io.js"
				}
			}
		</script>

		<script
			async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8702353126924450"
			crossorigin="anonymous"
		></script>

		<script src="//cdn.jsdelivr.net/npm/phaser@3.86.0/dist/phaser.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<script src="src/scenes/index.js" type="module"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Press+Start+2P&family=VT323&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<div id="game-container"></div>

		<form id="input-form">
			<div class="border">
				<input
					class="formElement"
					id="input-text"
					type="text"
					name="username"
					placeholder="Enter Username"
					required
					maxlength="16"
				/>
			</div>
			<div class="border">
				<button class="formElement" id="start-btn" type="button">Start Game</button>
			</div>
		</form>

		<div id="loading-screen">
			<div id="loading-bar-bg">
				<div id="loading-bar"></div>
			</div>
			<p id="loading-text">Loading...</p>
		</div>

		<a id="repo-link" href="https://github.com/tgilholm/PirateGame">
			<img src="assets/github-logo.png" width="50px" height="50px" />
		</a>

		<div id="ui-container">
			<!-- Interaction prompt -->

			<div id="prompt-container">
				<div id="interaction-prompt" class="prompt" style="display: none"></div>
				<div id="release-prompt" class="prompt" style="display: none"></div>
			</div>

			<div class="left-panel" id="left-panel">
				<div id="minimap-container">
					<img id="minimap" />
					<canvas id="minimap-canvas"></canvas>
				</div>
				<div class="game-stats" style="display: none">
					<p id="fps-counter" style="color: green">FPS:</p>
					<p id="model-counter" style="color: green">Nearby Models:</p>
					<p id="ship-stats" style="color: green">Player Ship:</p>
					<p id="position" style="color: green">Position:</p>
					<p id="ship-position" style="color: green">Ship Position:</p>
					<p id="player-stats" style="color: green"></p>
				</div>
			</div>

			<div class="right-panel" id="right-panel">
				<!--Active Player Container-->
				<div id="players-panel" style="display: none">
					<div class="players-title">Players Online</div>
					<ol id="players-list"></ol>
				</div>
				<div id="gold-counter">Gold: 0</div>
			</div>

			<div id="shop-menu" style="display: none">
				<h2>Ship Upgrades</h2>
				<div class="shop-grid"></div>
				<button id="shop-close-button">Close</button>
			</div>
			<div id="dig-minigame" style="display: none">
				<div id="dig-bar">
					<div id="dig-success-zone"></div>
					<div id="dig-slider"></div>
				</div>
				<div id="dig-label">Press Space in the green zone</div>
			</div>
			<div id="death-screen">
				<h1>Scuttled!</h1>
				<h2>Your ship has sunk. Respawn or return to the main menu.</h2>
				<button id="restart-button">Respawn</button>
				<button id="quit-button">Quit</button>
			</div>
		</div>

		<!-- Reusable templates for shop items -->
		<template class="shop-card-template">
			<div class="shop-card">
				<span class="shop-card-name"></span>
				<p class="shop-card-description"></p>
				<span class="shop-card-level"></span>
				<span class="shop-card-benefit"></span>
				<div class="shop-card-bottom-row">
					<span class="shop-card-cost"></span>
					<button class="shop-card-buy">Buy</button>
				</div>
			</div>
		</template>
	</body>
</html>
