<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Pirate Game</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="styles.css" />

		<!-- The browser cannot load assets in another folder by default -->
		<script type="importmap">
			{
				"imports": {
					"shared/built/": "/shared/",
					"shared/": "/shared/",
					"socket.io-client": "/socket.io/socket.io.js"
				}
			}
		</script>

		<script src="//cdn.jsdelivr.net/npm/phaser@3.86.0/dist/phaser.js"></script>
		<script src="/socket.io/socket.io.js"></script>
		<script src="src/scenes/index.js" type="module"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Press+Start+2P&family=VT323&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<div id="game-container"></div>

		<form id="input-form">
			<div class="border">
				<input
					class="formElement"
					id="input-text"
					type="text"
					name="username"
					placeholder="Enter Username"
					required
					maxlength="16"
				/>
			</div>
			<div class="border">
				<button class="formElement" id="start-btn" type="button">Start Game</button>
			</div>
		</form>

		<div id="ui-container">
			<!-- Interaction prompt -->

			<div id="prompt-container">
				<div id="interaction-prompt" class="prompt" style="display: none"></div>
				<div id="release-prompt" class="prompt" style="display: none"></div>
			</div>

			<div class="left-panel" id="left-panel">
				<div id="gold-counter" style="display: flex">Gold: 0</div>

				<div id="minimap-container">
					<img id="minimap" />
				</div>

				<div class="game-stats" style="display: none">
					<p id="fps-counter" style="color: green">FPS:</p>
					<p id="model-counter" style="color: green">Nearby Models:</p>
					<p id="ship-stats" style="color: green">Player Ship:</p>
					<p id="position" style="color: green">Position:</p>
					<p id="ship-position" style="color: green">Ship Position:</p>
					<p id="player-stats" style="color: green"></p>
				</div>
			</div>

			<!-- Shop overlay -->
			<div id="shop-menu" style="display: none"></div>

			<!--Active Player Container-->
			<div id="players-panel" style="display: none">
				<div class="players-title">Players Online</div>
				<ol id="players-list"></ol>
			</div>

			<!-- Dig minigame UI -->
			<div id="dig-minigame" style="display: none">
				<div id="dig-bar">
					<div id="dig-success-zone"></div>
					<div id="dig-slider"></div>
				</div>
				<div id="dig-label">Press X in the green zone</div>
			</div>
			<div id="death-screen">
				<h1>Scuttled!</h1>
				<h2>Your ship has sunk. Respawn or return to the main menu.</h2>
				<button id="restart-button">Respawn</button>
				<button id="quit-button">Quit</button>
			</div>
		</div>
	</body>
</html>
